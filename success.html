<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Your course | Human Nature Stories Studio</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2e2a26;
      background: #fbf3e0;
    }

    * { box-sizing: border-box; }

    body { margin: 0; padding: 32px 16px; }

    main {
      width: min(760px, 100%);
      margin: 0 auto;
      padding: clamp(24px, 6vw, 48px);
      border: 2px solid #000;
      border-radius: 18px;
      background: #fff;
      box-shadow: 8px 8px 0 #000;
    }

    .badge {
      display: inline-block;
      margin-bottom: 12px;
      padding: 6px 12px;
      border: 2px solid #000;
      border-radius: 999px;
      background: #e8a83a;
      font-size: .85rem;
      font-weight: 800;
    }

    h1, h2 { line-height: 1.15; }
    h1 { margin: 0 0 10px; }
    p { line-height: 1.55; }
    section { margin-top: 28px; }

    a {
      display: inline-block;
      margin: 4px 8px 4px 0;
      padding: 10px 16px;
      border: 2px solid #000;
      border-radius: 999px;
      background: #e8a83a;
      color: #2e2a26;
      font-weight: 800;
      text-decoration: none;
    }

    a:hover { background: #c98418; }
    video { display: block; width: 100%; max-height: 70vh; background: #000; }
    [hidden] { display: none !important; }
    #status { color: #5a3a22; }
  </style>
</head>
<body>
  <main>
    <span class="badge">Payment verified</span>
    <h1>Your course is ready</h1>
    <p>Download the guide and watch the course video below. These links require your verified buyer session.</p>

    <section aria-labelledby="downloads-title">
      <h2 id="downloads-title">Download the PDF</h2>
      <div id="downloads"></div>
    </section>

    <section aria-labelledby="video-title">
      <h2 id="video-title">Watch the course video</h2>
      <video id="course-video" controls playsinline preload="metadata" hidden></video>
      <p id="video-empty" hidden>The course video is not available yet.</p>
    </section>

    <p id="status" role="status" aria-live="polite">Loading your course files…</p>
    <a href="/">Back to course page</a>
  </main>

  <script>
    const downloads = document.getElementById('downloads');
    const video = document.getElementById('course-video');
    const videoEmpty = document.getElementById('video-empty');
    const status = document.getElementById('status');

    async function loadCourse() {
      try {
        const response = await fetch('/api/course-content', { cache: 'no-store' });
        if (response.status === 401) {
          window.location.replace('/');
          return;
        }

        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Course files could not be loaded.');

        const pdfs = result.files.filter((file) => file.type === 'pdf');
        const videos = result.files.filter((file) => file.type === 'video');

        if (pdfs.length) {
          for (const file of pdfs) {
            const link = document.createElement('a');
            link.href = file.url;
            link.download = '';
            link.textContent = `Download ${file.name}`;
            downloads.append(link);
          }
        } else {
          downloads.textContent = 'The course PDF is not available yet.';
        }

        if (videos.length) {
          video.src = videos[0].url;
          video.hidden = false;
        } else {
          videoEmpty.hidden = false;
        }

        status.hidden = true;
      } catch (error) {
        status.textContent = error.message || 'Course files could not be loaded.';
      }
    }

    loadCourse();
  </script>
</body>
</html>
